name: Construir APK y AAB
on:
  push:
  workflow_dispatch:
# Si subes otro cambio mientras se construye, se cancela el anterior (no esperas a dos builds).
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Número de compilación para Google Play (sube solo en cada build; ver app.config.js).
      VERSION_CODE: ${{ github.run_number }}
      # Llave de subida a Google Play (opcional; ver PLAY-STORE.md). Sin ella se firma con la llave de pruebas.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      # Caché de npm: la segunda vez no se vuelve a descargar todo.
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package.json') }}
          restore-keys: npm-
      # Caché de Gradle (dependencias y resultados de compilación): es lo que más tiempo ahorra.
      - uses: gradle/actions/setup-gradle@v6
      - run: npm install --legacy-peer-deps --no-audit --no-fund --prefer-offline
      # Comprueba que las versiones de los módulos de Expo son las del SDK (si alguna no coincide, la corrige)
      - run: npx expo install --check || npx expo install --fix -- --legacy-peer-deps
      - run: npx expo prebuild --platform android --no-install
      - run: node tools/firma.js
      # assembleRelease = APK para instalar a mano; bundleRelease = AAB para subir a Google Play.
      # Solo arm64-v8a (todos los móviles Android de los últimos años): compila el código nativo una vez en vez de cuatro.
      # --parallel y --build-cache: usa todos los núcleos y reaprovecha lo ya compilado.
      - run: >
          cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease
          -PreactNativeArchitectures=arm64-v8a --parallel --build-cache --warning-mode none
          -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC"
      - uses: actions/upload-artifact@v6
        with:
          name: nevu-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: nevu-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
